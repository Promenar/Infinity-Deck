name: Android CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: 静态检查与工作流契约
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出源码
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: 配置 Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.14"

      - name: 配置 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.1"
          cache-dependency-path: |
            native-ui/app/tailnet/go.sum
            native-ui/app/proxy/go.sum

      - name: 验证内置代理
        working-directory: native-ui/app/proxy
        run: go test -v ./...

      - name: 验证 Tailscale 代理
        working-directory: native-ui/app/tailnet
        run: go test -v ./...

      - name: 运行静态检查
        run: bash scripts/ci/android-static-checks.sh
